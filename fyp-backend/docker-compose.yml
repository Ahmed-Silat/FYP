version: '3.8'

services:
  postgres:
    image: postgres:14.5-alpine
    restart: always
    environment:
      - POSTGRES_DB=recruit_ease
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ahmed123
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: